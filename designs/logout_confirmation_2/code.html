<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quallor - Logout Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header -->
<header class="flex items-center justify-between px-4 py-4 border-b border-primary/10 bg-background-light dark:bg-background-dark">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight text-slate-900 dark:text-slate-100">Account</h1>
<div class="size-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12 text-center">
<!-- Icon/Visual Container -->
<div class="mb-8 flex items-center justify-center size-24 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined !text-5xl">logout</span>
</div>
<!-- Confirmation Text -->
<h2 class="text-3xl font-bold leading-tight mb-4 text-slate-900 dark:text-slate-100">
                Log out of Quallor?
            </h2>
<p class="text-lg text-slate-600 dark:text-slate-400 max-w-sm mb-12">
                You'll need to enter your email and password to access your account again.
            </p>
<!-- Action Buttons -->
<div class="flex flex-col gap-4 w-full max-w-sm">
<button class="flex h-14 items-center justify-center rounded-xl bg-primary text-background-dark text-lg font-bold transition-transform active:scale-95 shadow-lg shadow-primary/20">
                    Log Out
                </button>
<button class="flex h-14 items-center justify-center rounded-xl border border-primary/20 bg-primary/5 text-primary text-lg font-semibold transition-colors hover:bg-primary/10 active:scale-95">
                    Cancel
                </button>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="sticky bottom-0 w-full border-t border-primary/10 bg-background-light dark:bg-background-dark px-4 pb-6 pt-2">
<div class="flex justify-around items-center max-w-md mx-auto">
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Home</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">search</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Search</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">hexagon</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Quallor</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">favorite</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Activity</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined !fill-1">person</span>
<span class="text-[10px] font-medium uppercase tracking-wider">Profile</span>
</a>
</div>
</nav>
</div>
</body></html>
