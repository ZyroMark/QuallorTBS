<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "secondary": "#0ea5e9",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
<div class="relative flex h-screen max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Header -->
<div class="flex items-center p-4 justify-between bg-background-light dark:bg-background-dark border-b border-primary/10">
<button class="text-slate-900 dark:text-slate-100 flex size-10 items-center justify-center hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Digital Ticket</h2>
</div>
<div class="flex-1 overflow-y-auto pb-24">
<!-- Ticket Card -->
<div class="p-6">
<div class="bg-slate-50 dark:bg-slate-900/40 rounded-xl border border-primary/20 p-6 flex flex-col items-center shadow-xl relative overflow-hidden">
<!-- Sky Blue Accent Element -->
<div class="absolute -top-12 -right-12 w-24 h-24 bg-secondary/10 rounded-full blur-2xl"></div>
<div class="text-center mb-6">
<p class="text-primary text-xs font-bold uppercase tracking-widest mb-1">Booking Confirmation</p>
<h3 class="text-slate-900 dark:text-slate-100 text-2xl font-black leading-tight">HK-7729-ELPE</h3>
</div>
<!-- QR Code Placeholder -->
<div class="w-full aspect-square bg-white p-4 rounded-lg shadow-inner mb-6 flex items-center justify-center group">
<div class="w-full h-full bg-slate-100 flex items-center justify-center relative rounded border-2 border-dashed border-slate-300">
<img alt="Ticket QR code for scanning" class="w-full h-full object-contain" data-alt="Prominent black and white QR code for ticket verification" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBVn94b-uDfEYSpPDIOFlxrMJnIk23wgufX8PgLNAuMQElzhZRzIViGDLc-JH5pMkvLI8M7FSrAqOFaoXcdobODMJvgDTUHYUJmI2oqyrk9arDhbr7Yoh7vrLv39kTxcpazOQC35qpKQziPExm3TSf5qoYZd2Dn_eLtaQzX-HsazLxIXfFPiNcYS0eJ9i_0QZlja60oSs-nu5vwGYA2TqTYX8-kwVJPUwPi6lyr1ncM0XzuzAqutCAj3y75KRJjkL3DAOxFEIeADGnN"/>
<div class="absolute inset-0 bg-secondary/5 pointer-events-none"></div>
</div>
</div>
<!-- Details List -->
<div class="w-full space-y-4 pt-4 border-t border-slate-200 dark:border-slate-800">
<div class="flex justify-between items-start">
<div>
<p class="text-primary/70 text-[10px] font-bold uppercase tracking-wider">Route</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold">East London to Port Elizabeth</p>
</div>
<div class="text-right">
<p class="text-primary/70 text-[10px] font-bold uppercase tracking-wider">Seat</p>
<p class="text-secondary text-sm font-black">A4</p>
</div>
</div>
<div class="flex justify-between items-start">
<div>
<p class="text-primary/70 text-[10px] font-bold uppercase tracking-wider">Date &amp; Time</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-medium">Oct 24, 2023, 08:30 AM</p>
</div>
<div class="text-right">
<p class="text-primary/70 text-[10px] font-bold uppercase tracking-wider">Fare Total</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-bold">R250.00</p>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="mt-8 flex flex-col gap-3">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">download</span>
                        Download Ticket
                    </button>
<button class="w-full bg-secondary/10 hover:bg-secondary/20 text-secondary font-bold py-4 rounded-xl flex items-center justify-center gap-2 border border-secondary/30 transition-all active:scale-[0.98]">
<span class="material-symbols-outlined">share</span>
                        Share Ticket
                    </button>
</div>
</div>
</div>
<!-- Bottom Navigation -->
<div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto z-50">
<div class="flex gap-2 border-t border-slate-200 dark:border-slate-800 bg-background-light dark:bg-background-dark px-4 pb-6 pt-2 shadow-[0_-10px_20px_rgba(0,0,0,0.1)]">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">home</span>
<p class="text-[10px] font-bold tracking-wider">HOME</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined active-icon text-[26px]">hiking</span>
<p class="text-[10px] font-bold tracking-wider">HIKE</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">history</span>
<p class="text-[10px] font-bold tracking-wider">HISTORY</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[26px]">person</span>
<p class="text-[10px] font-bold tracking-wider">PROFILE</p>
</a>
</div>
</div>
</div>
</body></html>
