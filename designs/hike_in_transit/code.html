<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>HIKE - In Transit</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-hidden">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Header Navigation -->
<div class="flex items-center bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md p-4 z-20 border-b border-primary/10">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<div class="ml-4 flex-1">
<h2 class="text-lg font-bold leading-tight tracking-tight">In-Transit</h2>
<p class="text-xs text-slate-500 dark:text-primary/60 font-medium">East London → Port Elizabeth</p>
</div>
<button class="flex h-10 w-10 items-center justify-center rounded-full bg-red-500/20 text-red-500 border border-red-500/30">
<span class="material-symbols-outlined">sos</span>
</button>
</div>
<!-- Map Viewport -->
<div class="relative flex-1 bg-slate-200 dark:bg-zinc-900">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Dark mode navigation map showing amber route line" data-location="Eastern Cape, South Africa" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAWpqtwxxWH7901F8Vdl_UxFvNMYA88u8Olcxp8zOVKR_eAn3f739xSqDU4KKPZ0EvSe4Hgf6JTPHaL4Cdnqm1BiQxl2AOdhJVIxffxdbSti9bGrMjMXOgnkNzQrFHVas8afCAQWFOrJhsutnZfbLo58OqUwUQE1u51ceTi-SRzX0lWBnnna3ZtIZ0D800FV9cSGaNxjQ-WWArxKztYUKxy6pbSX2Clpg6YrsSZZa4_nRYWO6Oq_iKzMsVIPYiNSBbymWZ0cimCV6lh')">
</div>
<!-- Map Controls -->
<div class="absolute right-4 top-4 flex flex-col gap-2">
<button class="flex size-12 items-center justify-center rounded-xl bg-background-light dark:bg-zinc-800 shadow-lg text-primary">
<span class="material-symbols-outlined">add</span>
</button>
<button class="flex size-12 items-center justify-center rounded-xl bg-background-light dark:bg-zinc-800 shadow-lg text-primary border-t border-primary/5">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="mt-2 flex size-12 items-center justify-center rounded-xl bg-primary text-background-dark shadow-lg">
<span class="material-symbols-outlined">navigation</span>
</button>
</div>
<!-- Floating Search Bar -->
<div class="absolute left-4 right-4 top-4 max-w-md mx-auto hidden md:block">
<div class="flex items-center gap-2 rounded-xl bg-background-light/90 dark:bg-zinc-800/90 backdrop-blur px-4 py-2 shadow-xl border border-primary/10">
<span class="material-symbols-outlined text-primary">search</span>
<input class="bg-transparent border-none focus:ring-0 text-sm w-full py-1 text-slate-100" placeholder="Search along route" type="text"/>
</div>
</div>
</div>
<!-- Bottom Navigation / Sheet -->
<div class="relative z-30 flex flex-col bg-background-light dark:bg-zinc-900 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.3)] border-t border-primary/20">
<!-- Pull Handle -->
<div class="flex h-6 w-full items-center justify-center">
<div class="h-1.5 w-12 rounded-full bg-slate-300 dark:bg-primary/20"></div>
</div>
<!-- Trip Info Content -->
<div class="px-6 pb-6 pt-2">
<div class="flex justify-between items-start mb-6">
<div>
<div class="flex items-center gap-2 mb-1">
<span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider bg-primary text-background-dark">HIKE Navigation</span>
<span class="text-primary text-xs font-semibold">• On Schedule</span>
</div>
<h3 class="text-2xl font-bold">Port Elizabeth</h3>
<p class="text-slate-500 dark:text-slate-400 text-sm">Arriving at Gqeberha Terminal</p>
</div>
<div class="text-right">
<p class="text-3xl font-bold text-primary">2h 15m</p>
<p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-widest font-bold">Remaining</p>
</div>
</div>
<!-- Vehicle/Driver Details -->
<div class="flex items-center gap-4 p-4 rounded-2xl bg-primary/5 border border-primary/10 mb-6">
<div class="size-12 rounded-full bg-primary/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl">directions_bus</span>
</div>
<div class="flex-1">
<p class="text-xs text-slate-500 dark:text-slate-400 uppercase font-bold">License Plate</p>
<p class="text-lg font-bold tracking-tight">EC-HIKE-420-PE</p>
</div>
<div class="text-right">
<p class="text-xs text-slate-500 dark:text-slate-400 uppercase font-bold">Status</p>
<p class="text-sm font-semibold text-green-500">Verified Trip</p>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 rounded-xl bg-primary py-4 px-6 text-background-dark font-bold transition-transform active:scale-95 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">share</span>
                        Share Trip
                    </button>
<button class="flex items-center justify-center gap-2 rounded-xl bg-zinc-800 border border-primary/20 py-4 px-6 text-primary font-bold transition-transform active:scale-95">
<span class="material-symbols-outlined">contact_support</span>
                        Trip Support
                    </button>
</div>
</div>
<!-- Bottom Nav Bar Component -->
<div class="flex gap-2 border-t border-primary/10 bg-zinc-900/50 px-4 pb-6 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-medium leading-normal">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill-1">route</span>
<p class="text-[10px] font-medium leading-normal">Trips</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">shield</span>
<p class="text-[10px] font-medium leading-normal">Safety</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-500" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-medium leading-normal">Profile</p>
</a>
</div>
</div>
</div>
</body></html>
