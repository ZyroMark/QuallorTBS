<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Quallor - Personal Info</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header Navigation -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 sticky top-0 z-10 border-b border-primary/10">
<button class="text-slate-900 dark:text-slate-100 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 ml-2">Personal Info</h2>
<div class="size-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto pb-24">
<!-- Profile Header -->
<div class="flex p-6 @container">
<div class="flex w-full flex-col gap-4 items-center">
<div class="flex gap-4 flex-col items-center">
<div class="relative group">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 border-4 border-primary/20 shadow-xl" data-alt="Professional headshot of a smiling man with a clean beard" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuAPBDhUewS5VUAR0nI0DMKDRVVaIWIzvliF79kOacP3G7P2cP8gMUEQZ4CZ3SWjz_jJM2B9Uppi2W882r7414cJyrRrdGkn-TLJBtFDC50rLsudtVDya5OjfTQlk7VacNif9qpyWIRAGEQmMxQlemNZlXiTUlF-jcgVbCJoXb1f5x_i8CO-J7Fl0j2WoaSriVAVyzdP0poe1PsrZNGrvUR2S_pcJmY344RPfenc9MRRw-5n4VYp03cDjnprht1GrCWpSbyUPpYdXL-P");'>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-background-dark p-2 rounded-full shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined text-sm">edit</span>
</button>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-slate-900 dark:text-slate-100 text-2xl font-bold leading-tight tracking-tight text-center">Alex Thompson</p>
<p class="text-primary text-sm font-medium leading-normal text-center">Premium Member</p>
</div>
</div>
</div>
</div>
<!-- Form Fields -->
<div class="px-6 space-y-5 max-w-lg mx-auto">
<div class="space-y-2">
<label class="block text-slate-900 dark:text-slate-100 text-sm font-semibold ml-1">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">person</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-primary/20 bg-primary/5 dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Enter your full name" type="text" value="Alex Thompson"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-slate-900 dark:text-slate-100 text-sm font-semibold ml-1">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">call</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-primary/20 bg-primary/5 dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="+1 (555) 000-0000" type="tel" value="+1 (555) 123-4567"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-slate-900 dark:text-slate-100 text-sm font-semibold ml-1">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">mail</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-primary/20 bg-primary/5 dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="email@example.com" type="email" value="alex.t@quallor.app"/>
</div>
</div>
<div class="space-y-2">
<label class="block text-slate-900 dark:text-slate-100 text-sm font-semibold ml-1">ID Number (Optional)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">badge</span>
<input class="w-full pl-12 pr-4 py-4 rounded-xl border border-primary/20 bg-primary/5 dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Enter your government ID" type="text" value="Q-88294412"/>
</div>
</div>
<div class="pt-4 pb-8">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
<span class="material-symbols-outlined">save</span>
                    Save Changes
                </button>
</div>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 border-t border-primary/10 bg-background-light dark:bg-background-dark px-4 pb-6 pt-3 flex justify-between items-center z-20">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-semibold leading-normal tracking-wide">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">directions_car</span>
<p class="text-[10px] font-semibold leading-normal tracking-wide">Commute</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined">verified_user</span>
<p class="text-[10px] font-semibold leading-normal tracking-wide">Safety</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<p class="text-[10px] font-bold leading-normal tracking-wide">Profile</p>
<div class="w-1 h-1 bg-primary rounded-full mt-0.5"></div>
</a>
</nav>
</body></html>
