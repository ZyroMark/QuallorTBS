<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>In-Transit - Quallor Driver</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "accent-blue": "#0ea5e9",
                        "accent-red": "#ef4444",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Top Status Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark border-b border-primary/10 p-4 justify-between z-20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">menu</span>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight">In Transit</h2>
</div>
<div class="flex items-center gap-2 px-3 py-1 rounded-full bg-primary/10 border border-primary/20">
<span class="material-symbols-outlined text-primary text-sm">group</span>
<p class="text-primary text-sm font-bold leading-normal">8/15 Boarded</p>
</div>
</div>
<!-- Main Map Area -->
<div class="relative flex-1 bg-slate-200 dark:bg-slate-800">
<!-- Simulated Map Image -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="Navigation map showing highway route between two cities" data-location="East London to Port Elizabeth South Africa" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCUthRwOGjgiwe5Lj4OLj63f3LE1R9cqljcavoKHkuyLWM3WPZeffTZR3Qj4gDf7YcWoEvPeNuJ5Nmztagw6lK6YcLj7uBQvEVhCuq25fgN3-ut7yMEpxWy--fFZaXGug9L7gDl7pL5r1pKPl6dLPfPQerLp6byhgB8VgCMtlOWnLWmE_IvziZd9XI-QTZMbKQ0e9VzK6Q0c9f1UoXqlB6E2vxDACEqvyGIWRaCcxxVTNV1H0AhzBnVYluuWYfz-29WvaDNbj5WD8j9');">
<!-- Map Overlay: Search / Current Location Navigation -->
<div class="absolute top-4 left-4 right-4 z-10">
<div class="flex w-full items-center bg-background-light dark:bg-background-dark/90 backdrop-blur-md rounded-xl shadow-lg border border-primary/10 overflow-hidden h-12">
<div class="flex items-center justify-center pl-4">
<span class="material-symbols-outlined text-primary">navigation</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-slate-900 dark:text-slate-100 placeholder:text-slate-500 text-sm font-medium px-4" placeholder="Navigating to Port Elizabeth" readonly=""/>
<div class="pr-4">
<span class="material-symbols-outlined text-accent-blue">settings_input_antenna</span>
</div>
</div>
</div>
<!-- Floating Map Controls -->
<div class="absolute right-4 top-20 flex flex-col gap-2 z-10">
<button class="flex size-10 items-center justify-center rounded-lg bg-background-light dark:bg-background-dark shadow-lg border border-primary/10">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">add</span>
</button>
<button class="flex size-10 items-center justify-center rounded-lg bg-background-light dark:bg-background-dark shadow-lg border border-primary/10">
<span class="material-symbols-outlined text-slate-900 dark:text-slate-100">remove</span>
</button>
<button class="flex size-10 items-center justify-center rounded-lg bg-primary shadow-lg mt-2">
<span class="material-symbols-outlined text-background-dark">my_location</span>
</button>
</div>
<!-- SOS Button (Floating) -->
<div class="absolute left-4 top-20 z-10">
<button class="flex size-12 items-center justify-center rounded-full bg-accent-red shadow-lg shadow-accent-red/30 border-2 border-white/20">
<span class="material-symbols-outlined text-white font-bold">emergency</span>
</button>
</div>
</div>
<!-- Bottom Floating Trip Details Card -->
<div class="absolute bottom-4 left-4 right-4 z-20">
<div class="flex flex-col rounded-xl shadow-2xl bg-background-light dark:bg-background-dark/95 backdrop-blur-md border border-primary/20 overflow-hidden">
<div class="p-4 border-b border-primary/10">
<div class="flex justify-between items-start mb-3">
<div>
<p class="text-xs uppercase tracking-wider text-slate-500 dark:text-slate-400 font-bold mb-1">Destination</p>
<h3 class="text-xl font-bold text-slate-900 dark:text-slate-100">Port Elizabeth</h3>
</div>
<div class="text-right">
<p class="text-primary text-lg font-bold">11:45 AM</p>
<p class="text-xs text-slate-500 dark:text-slate-400">ETA (2h 15m)</p>
</div>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10">
<span class="material-symbols-outlined text-slate-500 text-sm">route</span>
<span class="text-sm font-semibold">298 km</span>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10">
<span class="material-symbols-outlined text-accent-blue text-sm">traffic</span>
<span class="text-sm font-semibold text-accent-blue">Light Traffic</span>
</div>
</div>
</div>
<!-- Quick Actions -->
<div class="p-3 bg-slate-50 dark:bg-white/5 flex gap-2">
<button class="flex-1 h-11 flex items-center justify-center gap-2 rounded-lg bg-accent-blue text-white font-bold text-sm">
<span class="material-symbols-outlined text-sm">headset_mic</span>
                            Dispatch
                        </button>
<button class="flex-[1.5] h-11 flex items-center justify-center gap-2 rounded-lg bg-primary text-background-dark font-bold text-sm">
<span class="material-symbols-outlined text-sm">stop_circle</span>
                            End Trip
                        </button>
</div>
</div>
</div>
</div>
<!-- Bottom Navigation Bar -->
<div class="flex border-t border-primary/10 bg-background-light dark:bg-background-dark px-4 pb-6 pt-2 z-30">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">home</span>
<p class="text-[10px] font-medium leading-none">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary" href="#">
<span class="material-symbols-outlined fill">steering_wheel_heat</span>
<p class="text-[10px] font-bold leading-none">Drive</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">calendar_month</span>
<p class="text-[10px] font-medium leading-none">Schedule</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">payments</span>
<p class="text-[10px] font-medium leading-none">Earnings</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-slate-500 dark:text-slate-400" href="#">
<span class="material-symbols-outlined">person</span>
<p class="text-[10px] font-medium leading-none">Profile</p>
</a>
</div>
</div>
</body></html>
