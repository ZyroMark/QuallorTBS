<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2a60d",
                        "background-light": "#f8f7f5",
                        "background-dark": "#221c10",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>Quallor - Change Password</title>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
<!-- Header / TopAppBar -->
<header class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between border-b border-slate-200 dark:border-primary/20">
<button aria-label="Go back" class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Change Password</h2>
</header>
<main class="max-w-[480px] mx-auto w-full flex flex-col">
<!-- Introduction Section -->
<div class="px-4 pt-8 pb-4">
<h3 class="text-slate-900 dark:text-slate-100 tracking-light text-2xl font-bold leading-tight">Secure Your Account</h3>
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-normal mt-2">
                    Your new password must be at least 8 characters long and include a mix of letters, numbers, and symbols.
                </p>
</div>
<!-- Form Container -->
<div class="flex flex-col gap-6 px-4 py-4">
<!-- Current Password Field -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider">Current Password</label>
<div class="flex w-full items-stretch rounded-lg group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg rounded-r-none border border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-primary/40 p-[15px] border-r-0 text-base font-normal leading-normal" placeholder="Enter current password" type="password"/>
<button class="text-slate-400 dark:text-primary/60 flex border border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/5 items-center justify-center px-4 rounded-r-lg border-l-0 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- New Password Field -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider">New Password</label>
<div class="flex w-full items-stretch rounded-lg group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg rounded-r-none border border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-primary/40 p-[15px] border-r-0 text-base font-normal leading-normal" placeholder="Enter new password" type="password"/>
<button class="text-slate-400 dark:text-primary/60 flex border border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/5 items-center justify-center px-4 rounded-r-lg border-l-0 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Confirm New Password Field -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-100 text-sm font-semibold uppercase tracking-wider">Confirm New Password</label>
<div class="flex w-full items-stretch rounded-lg group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg rounded-r-none border border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/5 text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary h-14 placeholder:text-slate-400 dark:placeholder:text-primary/40 p-[15px] border-r-0 text-base font-normal leading-normal" placeholder="Confirm new password" type="password"/>
<button class="text-slate-400 dark:text-primary/60 flex border border-slate-300 dark:border-primary/30 bg-white dark:bg-primary/5 items-center justify-center px-4 rounded-r-lg border-l-0 hover:text-primary transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Password Strength Indicator (Optional Visual Enhancement) -->
<div class="flex flex-col gap-2 mt-2">
<div class="flex justify-between items-center">
<span class="text-xs text-slate-500 dark:text-slate-400">Password Strength</span>
<span class="text-xs font-bold text-primary">Strong</span>
</div>
<div class="flex gap-1 h-1">
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-primary rounded-full"></div>
<div class="flex-1 bg-slate-300 dark:bg-primary/20 rounded-full"></div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-base h-14 rounded-xl transition-all shadow-lg shadow-primary/20 active:scale-[0.98]">
                        Save New Password
                    </button>
</div>
<!-- Help Link -->
<div class="text-center pt-4 pb-10">
<a class="text-primary hover:underline text-sm font-medium" href="#">Forgot your current password?</a>
</div>
</div>
</main>
<!-- Bottom Decoration -->
<div class="mt-auto h-2 bg-gradient-to-r from-transparent via-primary/20 to-transparent"></div>
</div>
</body></html>
